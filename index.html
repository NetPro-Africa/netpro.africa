<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="NetPro News"
      href="%BASE_URL%news/rss.xml"
    />
    <title data-prerender>NetPro International Limited</title>
    <meta
      data-prerender
      name="description"
      content="Leading Innovation &amp; Technology Transformation in Africa since 2000"
    />
    <script>
      (function () {
        var themeStorageKey = 'netpro-theme-mode';
        var themeMode = 'dark';

        try {
          themeMode =
            window.localStorage.getItem(themeStorageKey) === 'light'
              ? 'light'
              : 'dark';
        } catch (error) {
          themeMode = 'dark';
        }

        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(themeMode);
        document.documentElement.style.colorScheme = themeMode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
